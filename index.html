<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Before Midnight</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MUSIC BUTTON -->
    <button
        id="musicToggle"
        class="music-toggle"
        aria-label="Toggle music"
    >
        ♪
    </button>


    <main class="opening-page">

        <div class="time">
            11:58 PM
        </div>

        <div class="line"></div>

        <section class="intro">

            <p class="intro-title">
                Before we reach midnight...
            </p>

            <p class="intro-subtitle">
                there's a little story<br>
                to revisit.
            </p>

        </section>

        <button id="beginBtn">
            BEGIN
        </button>

    </main>


    <!-- BACKGROUND MUSIC -->
    <audio
        id="backgroundMusic"
        src="music/memories.mp3"
        loop
        preload="auto"
    ></audio>


    <script src="js/content.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
