<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Our Memories</title>

    <link
        rel="stylesheet"
        href="../css/memories.css"
    >
</head>

<body>

    <!-- ==========================================
         BACKGROUND
    =========================================== -->

    <div
        class="memory-background"
        id="memoryBackground"
    ></div>

    <div class="memory-overlay"></div>


    <!-- ==========================================
         BACKGROUND MUSIC
    =========================================== -->

    <audio
        id="backgroundMusic"
        src="../music/memories.mp3"
        loop
        preload="auto"
    ></audio>


    <!-- ==========================================
         MUSIC BUTTON
    =========================================== -->

    <button
        id="musicToggle"
        class="music-toggle"
        aria-label="Toggle music"
    >
        ♪
    </button>


    <!-- ==========================================
         MAIN PAGE
    =========================================== -->

    <main class="memories-page">


        <!-- ======================================
             HEADER
        ======================================= -->

        <header class="memories-header">

            <p
                class="small-title"
                id="smallTitle"
            >
                A LITTLE PIECE OF US
            </p>

            <h1 id="memoryTitle">
                OUR MEMORIES
            </h1>

            <p
                class="memory-subtitle"
                id="memorySubtitle"
            >
                some moments are worth keeping.
            </p>


            <!-- SCROLL INDICATOR -->

            <div class="scroll-indicator">

                <span>
                    SCROLL
                </span>

                <div class="scroll-line"></div>

            </div>

        </header>


        <!-- ======================================
             MEMORY GRID
        ======================================= -->

        <section
            class="memory-grid"
            id="memoryGrid"
        >
        </section>


        <!-- ======================================
             MIDNIGHT WAIT
        ======================================= -->

        <section class="midnight-wait">

            <p class="wait-label">
                UNTIL MIDNIGHT
            </p>

            <h2 id="waitTitle">
                Waiting for midnight...
            </h2>

            <p id="waitText">
                There's still one more thing waiting.
            </p>


            <!-- COUNTDOWN -->

            <div
                id="countdown"
                class="countdown"
            >
                00:00:00
            </div>


            <!-- MIDNIGHT BUTTON -->

            <button
                id="midnightBtn"
                disabled
            >
                WAITING...
            </button>

        </section>

    </main>


    <!-- ==========================================
         FULLSCREEN MEMORY VIEWER
    =========================================== -->

    <div
        class="viewer"
        id="viewer"
    >


        <!-- CLOSE -->

        <button
            class="viewer-close"
            id="viewerClose"
        >
            ×
        </button>


        <!-- PREVIOUS -->

        <button
            class="viewer-prev"
            id="viewerPrev"
        >
            ‹
        </button>


        <!-- VIEWER CONTENT -->

        <div class="viewer-content">

            <div
                id="viewerMedia"
                class="viewer-media"
            ></div>


            <div class="viewer-info">

                <p
                    id="viewerDate"
                    class="viewer-date"
                ></p>

                <p
                    id="viewerCaption"
                    class="viewer-caption"
                ></p>

            </div>

        </div>


        <!-- NEXT -->

        <button
            class="viewer-next"
            id="viewerNext"
        >
            ›
        </button>

    </div>


    <!-- ==========================================
         JAVASCRIPT
    =========================================== -->

    <script src="../js/content.js"></script>

    <script src="../js/memories.js"></script>

</body>

</html>
